<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Click&Cut · Administración</title>
<body><h1>Click&Cut · Administración</h1><p>Atención privada. No introduzcas contraseñas de clientes ni códigos de acceso.</p>
<form id="login"><label>Usuario <input name="username" autocomplete="username" required></label><label>Contraseña <input name="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form>
<p id="message" role="status"></p><main id="panel" hidden><button id="refresh">Actualizar</button><button id="logout">Salir</button><h2>Pendientes</h2><div id="work"></div><h2>Clientes y atención humana</h2><div id="customers"></div>
<h3>Conversación seleccionada</h3><pre id="conversation"></pre><form id="reply"><h3>Responder a cliente en modo humano</h3><label>ID cliente <input name="customer_id" required></label><label>Mensaje <textarea name="text" maxlength="2000"></textarea></label><label>Plantilla aprobada (opcional) <input name="template"></label><label>Idioma <input name="language" value="es_MX"></label><button>Enviar a cola</button></form>
<form id="product" hidden><h2>Catálogo (owner)</h2><label>ID <input name="id" required></label><label>Nombre <input name="name" required></label><label>Precio en centavos MXN <input name="price_cents" type="number" min="0" required></label><label>Activo <input name="active" type="checkbox" checked></label><button>Guardar</button></form><h2>Catálogo</h2><pre id="products"></pre><h2>Responsables</h2><pre id="users"></pre><h2>Estado de envíos</h2><pre id="outbox"></pre></main><script src="/admin.js" defer></script></body></html>
